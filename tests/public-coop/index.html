<!doctype html><meta charset="utf-8"><title>Public co-op checks</title><style>body{background:#182025;color:white;font:16px system-ui}iframe{width:900px;height:650px;border:1px solid #888}pre{white-space:pre-wrap}</style><h1>Public co-op checks</h1><button id="run">Run full-interface checks</button><pre id="result">Ready. Dedicated test origin only.</pre><iframe id="host" title="Host"></iframe><iframe id="guest" title="Partner"></iframe><script type="module">
const result=document.querySelector('#result'),host=document.querySelector('#host'),guest=document.querySelector('#guest');
const wait=async(fn,label)=>{const until=Date.now()+20000;while(Date.now()<until){if(fn())return;await new Promise(r=>setTimeout(r,100));}throw Error('Timeout: '+label);};
const assert=(value,label)=>{if(!value)throw Error(label);result.textContent+='PASS '+label+'\n';};
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;result.textContent='';const saved=new Map(Object.keys(localStorage).filter(k=>k.startsWith('pressure-front.')).map(k=>[k,localStorage.getItem(k)]));try{
for(const k of saved.keys())localStorage.removeItem(k);
host.src='/?map=dam';await wait(()=>host.contentDocument?.querySelector('#metal')?.textContent==='3000','host GPU');
await wait(()=>[...host.contentDocument.querySelectorAll('button')].some(b=>b.textContent==='HOST CO-OP'&&!b.disabled&&b.getClientRects().length>0),'host ready');
[...host.contentDocument.querySelectorAll('button')].find(b=>b.textContent==='HOST CO-OP').click();
await wait(()=>host.contentDocument.querySelector('a[href*="/coop/#"]'),'public room');
const link=host.contentDocument.querySelector('a[href*="/coop/#"]').href;guest.src='/?join#'+link.split('#')[1];
await wait(()=>guest.contentDocument?.querySelector('#connection')?.textContent.startsWith('CONNECTED'),'partner online');
const gd=guest.contentDocument,hd=host.contentDocument;
assert(gd.querySelectorAll('[data-tower]').length===hd.querySelectorAll('[data-tower]').length,'partner uses production tower menu');
assert(gd.querySelector('#research-tab')&&gd.querySelector('#buildings-tab'),'research and buildings tabs present');
const canvas=gd.querySelector('canvas'),pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;assert(pixels.some((v,i)=>i%4!==3&&v>80),'real battlefield rendered');
gd.querySelector('[data-tower="autocannon"]').click();await wait(()=>hd.querySelector('[data-tower="autocannon"]').classList.contains('active'),'shared tower selection');
const bounds=canvas.getBoundingClientRect(),point={clientX:bounds.left+bounds.width/2,clientY:bounds.top+bounds.height/2,pointerId:9002,button:0,bubbles:true};canvas.dispatchEvent(new PointerEvent('pointerdown',{...point,buttons:1}));canvas.dispatchEvent(new PointerEvent('pointerup',{...point,buttons:0}));
await wait(()=>hd.querySelector('#metal').textContent==='2920','tower placed');await wait(()=>gd.querySelector('#metal').textContent==='2920','shared budget');assert(true,'native UI places tower and synchronizes Metal');
gd.querySelector('[data-tower="autocannon"]').click();await wait(()=>!hd.querySelector('[data-tower="autocannon"]').classList.contains('active'),'deselect');
canvas.dispatchEvent(new PointerEvent('pointerdown',{...point,buttons:1}));canvas.dispatchEvent(new PointerEvent('pointerup',{...point,buttons:0}));
await wait(()=>gd.querySelector('.selected-popup').classList.contains('has-selection'),'tower inspector');assert(true,'partner can inspect deployed tower');
gd.querySelector('[data-upgrade="0"]').click();await wait(()=>Number(hd.querySelector('#metal').textContent)<2920,'upgrade purchase');assert(true,'partner upgrades tower through native inspector');
gd.querySelector('#research-tab').click();assert(gd.querySelector('.command').getClientRects().length>0,'native research tree opens');
const beforeResearch=Number(hd.querySelector('#metal').textContent);gd.querySelector('.command [data-command]:not([disabled])').click();await wait(()=>Number(hd.querySelector('#metal').textContent)<beforeResearch,'research purchase');assert(true,'partner buys real research');
gd.querySelector('#buildings-tab').click();assert(gd.querySelectorAll('[data-infantry="build"]').length>0,'native infantry build menu opens');
const beforeBuilding=Number(hd.querySelector('#metal').textContent);gd.querySelector('[data-infantry="build"][data-kind="phalanx"]').click();await wait(()=>hd.querySelector('[data-infantry="build"][data-kind="phalanx"]').classList.contains('active'),'infantry build tool');
const buildingPoint={...point,clientX:bounds.left+bounds.width*.65};canvas.dispatchEvent(new PointerEvent('pointerdown',{...buildingPoint,buttons:1}));canvas.dispatchEvent(new PointerEvent('pointerup',{...buildingPoint,buttons:0}));await wait(()=>Number(hd.querySelector('#metal').textContent)<beforeBuilding,'barracks purchase');assert(true,'partner builds infantry barracks');
gd.querySelector('[data-action="start-wave"]').click();await wait(()=>gd.querySelector('#phase').textContent==='COMBAT','shared wave');assert(true,'partner starts real wave');
[...hd.querySelectorAll('button')].find(b=>b.textContent==='STOP CO-OP').click();await wait(()=>gd.querySelector('.coop-offline'),'room revoked');assert(true,'stopping host revokes public room');
result.textContent+='ALL CHECKS PASSED';
}catch(error){result.textContent+='FAIL '+error.stack;}finally{host.src='about:blank';guest.src='about:blank';await new Promise(r=>setTimeout(r,300));for(const k of Object.keys(localStorage))if(k.startsWith('pressure-front.'))localStorage.removeItem(k);for(const[k,v]of saved)localStorage.setItem(k,v);document.querySelector('#run').disabled=false;}};
</script>
