<!doctype html><html lang="en"><meta charset="utf-8"><title>Landscape source assets</title><style>body{background:#292d28;color:#dedecd;font:13px monospace;margin:20px}main{display:grid;grid-template-columns:repeat(8,150px);gap:16px}figure{margin:0}canvas{image-rendering:pixelated;max-width:144px;min-width:80px;background:#191d18}a{color:#baca91}</style><h1>Red Alert landscape parts</h1><p><a href="?group=s">Cliffs</a> · <a href="?group=d">Roads</a> · <a href="?group=t">Trees</a> · <a href="?group=v">Buildings</a> · <a href="?group=p">Ground detail</a> · <a href="?group=s&biome=winter">Snow cliffs</a></p><main></main><script type="module">
const atlas=await fetch('/assets/red-alert/atlas.json').then(r=>r.json()),templates=await fetch('/scripts/red-alert-terrain.json').then(r=>r.json()),image=new Image();image.src='/assets/red-alert/atlas.png';await image.decode();const params=new URLSearchParams(location.search),biome=params.get('biome')??'forest',group=params.get('group')??'s';
for(const [name,ids]of Object.entries(atlas.sprites)){if(!name.startsWith(`${biome}:${group}`))continue;const key=name.split(':')[1],layout=templates[key],f=atlas.frames[ids[0]],canvas=document.createElement('canvas'),figure=document.createElement('figure'),label=document.createElement('figcaption');canvas.width=layout?layout.columns*24:f.width;canvas.height=layout?layout.rows*24:f.height;const ctx=canvas.getContext('2d');if(layout)ids.slice(0,layout.columns*layout.rows).forEach((id,i)=>{const tile=atlas.frames[id];ctx.drawImage(image,tile.x,tile.y,24,24,(i%layout.columns)*24,Math.floor(i/layout.columns)*24,24,24)});else ctx.drawImage(image,f.x,f.y,f.width,f.height,0,0,f.width,f.height);canvas.style.width=`${canvas.width*2}px`;label.textContent=`${key} · ${canvas.width}×${canvas.height}`;figure.append(canvas,label);document.querySelector('main').append(figure);}
</script></html>
