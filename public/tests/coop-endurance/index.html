const $=s=>document.querySelector(s),frames=[$('#host'),$('#one'),$('#two')],status=$('#status'),report=$('#report'),backupKey='pressure-front-e2e.multiplayer-backup.v1';let active=false,stopped=false,room='',result={checks:[],samples:[],errors:[],latencies:[]};

async function until(check,label,timeout=45000){const start=performance.now();while(!check()){if(stopped)throw Error('Stopped by user');if(performance.now()-start>timeout)throw Error('Timed out: '+label);await sleep(100);}return performance.now()-start;}

function pointer(i,x,y,phases=['pointermove','pointerdown','pointerup']){const canvas=el(i,'canvas'),b=canvas.getBoundingClientRect(),scale=Math.min(b.width/canvas.width,b.height/canvas.height),w=canvas.width*scale,h=canvas.height*scale;const hostCanvas=el(0,'canvas'),r=hostCanvas.getBoundingClientRect(),aspect=r.width/r.height,sx=Math.min(1,1.6/aspect),sy=Math.min(1,aspect/1.6);const nx=((x/160*2-1)*sx+1)/2,ny=((y/100*2-1)*sy+1)/2;const p={clientX:b.left+(b.width-w)/2+w*nx,clientY:b.top+(b.height-h)/2+h*ny,button:0,pointerId:9500+i,bubbles:true};for(const phase of phases)canvas.dispatchEvent(new PointerEvent(phase,{...p,buttons:phase==='pointerdown'?1:0}));}

for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>show(b.dataset.view);
async function restore(){stopped=true;const stop=[...(doc(0)?.querySelectorAll('button')??[])].find(b=>b.textContent==='STOP CO-OP');stop?.click();for(const frame of frames)frame.src='about:blank';await sleep(300);const saved=localStorage.getItem(backupKey);if(saved){for(const k of Object.keys(localStorage))if(k.startsWith('pressure-front.'))localStorage.removeItem(k);for(const[k,v]of JSON.parse(saved))localStorage.setItem(k,v);localStorage.removeItem(backupKey);}active=false;$('#run').disabled=false;}
$('#restore').onclick=async()=>{await restore();status.textContent='Stopped. Original saves restored.';};
if(localStorage.getItem(backupKey))await restore();
$('#run').onclick=async()=>{if(active)return;active=true;stopped=false;$('#run').disabled=true;result={checks:[],samples:[],errors:[],latencies:[]};
try{
 localStorage.setItem(backupKey,JSON.stringify(Object.keys(localStorage).filter(k=>k.startsWith('pressure-front.')).map(k=>[k,localStorage.getItem(k)])));for(const k of Object.keys(localStorage))if(k.startsWith('pressure-front.'))localStorage.removeItem(k);
 frames[0].src='/?map=dam';await until(()=>text(0,'#metal')==='3000','host GPU');
 for(const frame of frames)frame.addEventListener('load',()=>{frame.contentWindow?.addEventListener('error',e=>{result.errors.push(e.message);});});
 await until(()=>[...doc(0).querySelectorAll('button')].some(b=>b.textContent==='HOST CO-OP'&&b.getClientRects().length&&!b.disabled),'host service');[...doc(0).querySelectorAll('button')].find(b=>b.textContent==='HOST CO-OP').click();await until(()=>el(0,'a[href*="/coop/#"]'),'public room');room=el(0,'a[href*="/coop/#"]').href.split('#')[1];
 frames[1].src=frames[2].src='/?join#'+room;await until(()=>[1,2].every(i=>text(i,'#connection').startsWith('CONNECTED')),'two partners connected');await matchMetal();log('PASS: host and two partners connected through room '+room);
 for(const i of [1,2]){assert(el(i,'#research-tab')&&el(i,'#buildings-tab')&&doc(i).querySelectorAll('[data-tower]').length===9,'Full menus missing');const canvas=el(i,'canvas'),pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;assert(pixels.some((v,index)=>index%4!==3&&v>80),'Blank streamed battlefield');}log('PASS: both partners have full menus and rendered battlefield');
 let i=1;for(const[kind,x,y,cost]of [['tesla',54,38,600],['tesla',54,64,600],['incinerator',82,50,800],['mortar',78,64,350],['cryo',42,64,200],['autocannon',112,44,80],['autocannon',112,56,80]]){await build(i,kind,x,y,cost);i=i===1?2:1;log('PASS: partner '+(i===1?2:1)+' built '+kind+'; shared Metal '+text(0,'#metal'));}
 assert(text(0,'#metal')==='290','Defense exceeded original 3000 Metal');
 for(const[i,gate]of [[1,'north'],[2,'south']]){click(i,`[data-action="dam-${gate}"]`);await until(()=>el(0,`[data-action="dam-${gate}"]`).getAttribute('aria-pressed')==='true','gate closed');}log('PASS: both clients operate real dam gates');
 frames[2].src='about:blank';await sleep(600);frames[2].src='/?join#'+room;await until(()=>text(2,'#connection').startsWith('CONNECTED'),'partner rejoin');await matchMetal();log('PASS: partner disconnect/rejoin preserves shared defense');
 click(1,'[data-action="start-wave"]');await until(()=>[0,1,2].every(i=>text(i,'#phase')==='COMBAT'),'wave starts on all clients');log('PASS: partner starts wave on all clients');
 const begin=performance.now(),startSim=diagnostic().simulationSeconds;let floods=0,lastFlood=-100,paused=false,rejoined=false,lastSample=0;
 while(['COMBAT','SETTLING'].includes(text(0,'#phase'))){
  const d=diagnostic(),elapsed=d.simulationSeconds-startSim;assert(!d.invalid&&!d.readbackErrors.length,'GPU simulation error');assert(performance.now()-begin<360000,'Wave exceeded six minutes');
  if(elapsed>12&&!paused){frames[2].contentDocument.body.dispatchEvent(new KeyboardEvent('keydown',{key:' ',code:'Space',bubbles:true}));await until(()=>text(0,'#pause-state')==='PAUSED'||el(0,'[data-action="pause"]')?.textContent?.includes('RESUME')||text(0,'#message').includes('paused'),'pause',15000).catch(()=>{});await sleep(1200);const t=diagnostic().simulationSeconds;await sleep(800);assert(diagnostic().simulationSeconds===t,'Partner pause did not freeze simulation');frames[1].contentDocument.body.dispatchEvent(new KeyboardEvent('keydown',{key:' ',code:'Space',bubbles:true}));await until(()=>diagnostic().simulationSeconds>t,'resume');paused=true;log('PASS: one partner pauses and the other resumes');}
  if(elapsed>90&&!rejoined){frames[2].src='about:blank';await sleep(600);frames[2].src='/?join#'+room;await until(()=>text(2,'#connection').startsWith('CONNECTED')&&text(2,'#phase')==='COMBAT','partner rejoin during combat');rejoined=true;log('PASS: partner rejoins an ongoing wave');}
  if(d.waveProgress.queued>0&&elapsed>24&&elapsed-lastFlood>30&&el(1,'[data-action="dam-flood"]')&&!el(1,'[data-action="dam-flood"]').disabled){click(floods%2?2:1,'[data-action="dam-flood"]');await until(()=>el(0,'[data-action="dam-flood"]').disabled,'flood release applied');lastFlood=elapsed;floods++;}
  if(performance.now()-lastSample>3000){lastSample=performance.now();result.samples.push({seconds:Math.round(elapsed),kills:d.kills,live:d.live,queued:d.waveProgress.queued,integrity:text(0,'#base'),clients:[1,2].map(i=>({phase:text(i,'#phase'),metal:text(i,'#metal'),connection:text(i,'#connection')}))});report.textContent=JSON.stringify(result,null,2);status.textContent=`FULL WAVE · ${elapsed.toFixed(1)}s · ${d.kills} kills · ${d.waveProgress.queued} queued · ${d.live} live · ${text(0,'#base')} integrity · ${floods} floods`;}
  await sleep(500);
 }
 const final=diagnostic();assert(text(0,'#phase')==='PREPARATION','Defense ended in '+text(0,'#phase'));assert(final.live===0&&final.waveProgress.queued===0,'Wave ended with stranded enemies');await until(()=>[1,2].every(i=>text(i,'#phase')==='PREPARATION'),'both partners see cleared wave');await matchMetal();assert(floods>0,'No partner flood exercised');assert(!result.errors.length,'Browser errors: '+result.errors.join(';'));
 click(1,'#build-tab');click(1,'[data-action="upgrade-tool"]');await until(()=>el(0,'[data-action="upgrade-tool"]').classList.contains('active'),'upgrade tool');pointer(1,112,44,['pointermove']);await until(()=>el(1,'.upgrade-hover-card')&&!el(1,'.upgrade-hover-card').hidden,'partner hover inspector');const beforeUpgrade=Number(text(0,'#metal'));doc(1).body.dispatchEvent(new KeyboardEvent('keydown',{key:'q',code:'KeyQ',bubbles:true}));await until(()=>Number(text(0,'#metal'))<beforeUpgrade,'Q upgrade purchase');await matchMetal();log('PASS: partner hover inspector and Q branch upgrade work');doc(1).body.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',code:'Escape',bubbles:true}));
 result.outcome={phase:'PREPARATION',kills:final.kills,integrity:text(0,'#base'),seconds:final.simulationSeconds-startSim,wallSeconds:(performance.now()-begin)/1000,floods};log('PASS: full wave cleared on host + two partners; '+JSON.stringify(result.outcome));status.textContent='ALL CHECKS PASSED · Use the view buttons to inspect each client. Stop and restore saves when finished.';show('one');
}catch(error){result.errors.push(String(error));report.textContent=JSON.stringify(result,null,2);status.textContent='FAIL: '+String(error);show('one');}
